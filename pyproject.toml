[project]
name = "french-mining-pipeline"
version = "0.1.0"
description = "Automated French sentence-mining pipeline: immersion content -> scaffolded, intelligently ordered Anki cards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "spacy>=3.7",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "click>=8.1",  # spacy's `download` CLI needs this; some typer releases don't pull it in
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "fpdf2>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"french_mining.data" = ["*.csv"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
